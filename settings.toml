# ── About you ───────────────────────────────────────────────
#
# Your bio. Keep the three quote marks (""") on their own lines.
# A blank line starts a new paragraph.

bio = """
I'm a journalism student at UC Berkeley, with a focus on OSINT and 
investigative journalism. 

Previously, I reported on cross-strait relations and Taiwan's foreign affairs
for TaiwanPlus, an English-language broadcast news outlet based in Taipei. 
Before that, I was a breaking news reporter at The Baltimore Banner.
I've also worked on national investigative stories for The Washington Post.
"""

