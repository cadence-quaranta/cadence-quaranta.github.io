# ============================================================
#  ⭐  YOUR WEBSITE SETTINGS  ⭐
#
#  This is the only file you need to edit to build your site.
#  Change the text between the quote marks, save (commit), and
#  your website rebuilds itself automatically in a minute or two.
#
#  RULES OF THUMB
#  • Keep the quote marks: name = "Your Name"
#  • Lines starting with # are notes — the computer ignores them.
#  • To skip an option, leave it empty ("") or put a # at the beginning of that line.
#  • Full instructions live in the README file.
# ============================================================


# ── Who you are ─────────────────────────────────────────────

name = "Cadence Quaranta"                # ← Required. Everything else is optional.

# A short phrase describing you. Shows up big at the top of most templates.
tagline = ""

location = "Berkeley, California"

# ── For search engines only (optional) ──────────────────────
#
# These two lines never show up anywhere on your website. They
# are tucked invisibly into the page so Google, and the AI tools
# that read the web, can tell who you are and where you work.
# Fill them in if they apply to you. If not, leave them empty.

job_title = "Investigative Reporter"     # Your role, like "Reporter" or "Photojournalist"
employer = ""      # Where you work, intern, or freelance most

# ── The look of your site ───────────────────────────────────
#
# Pick one template (see the README for pictures of each):
#   "marquee"    – bold black-and-white with a huge headline
#   "editorial"  – elegant magazine-style serif type
#   "byline"     – minimal and airy, centered text
#   "ivory"      – soft ivory and navy, quiet and refined
#   "bloom"      – warm pastel colors, friendly and rounded
#   "newsprint"  – classic newspaper look on warm paper
#   "signal"     – huge bold headline, then a bright yellow band
#   "harbor"     – deep teal with a portrait sidebar and serif type

template = "byline"

